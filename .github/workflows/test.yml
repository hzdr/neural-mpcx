name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} - Py ${{ matrix.python-version }} (${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        variant: [core, full]
        include:
          - os: windows-latest
            python-version: "3.10"
            variant: full
          - os: windows-latest
            python-version: "3.12"
            variant: full

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies (Core)
        if: matrix.variant == 'core'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install dependencies (Full with Torch)
        if: matrix.variant == 'full'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,torch]"

      - name: Run Pytest with Coverage
        run: |
          pytest -v --cov=neuralmpcx --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest' && matrix.variant == 'full'
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
